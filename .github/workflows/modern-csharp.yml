name: C# moderno · build y comprobaciones

on:
  push:
    paths:
      - 'ejercicios-modernos/**'
      - '.github/workflows/modern-csharp.yml'
  pull_request:
    paths:
      - 'ejercicios-modernos/**'
      - '.github/workflows/modern-csharp.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Instalar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compilar en Release
        run: dotnet build ejercicios-modernos/DesarrolloJJGL.Console/DesarrolloJJGL.Console.csproj --configuration Release
      - name: Ejecutar comprobaciones
        run: dotnet run --project ejercicios-modernos/DesarrolloJJGL.Console/DesarrolloJJGL.Console.csproj --configuration Release --no-build -- --self-test
